{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher sign in</title><link rel="stylesheet" href="{% static 'lectures/recording.css' %}"></head>
<body><main class="center-card login-card"><p class="kicker">AI Lecture System</p><h1>Teacher sign in</h1><p>Use your local institutional account. Recordings stay on this computer.</p>{% if form.errors %}<div class="notice danger" role="alert">Sign-in details were not accepted.</div>{% endif %}<form method="post">{% csrf_token %}<label for="id_username">Username</label>{{ form.username }}<label for="id_password">Password</label>{{ form.password }}<input type="hidden" name="next" value="{{ next }}"><button type="submit">Sign in</button></form></main></body></html>
