[project]
name = "ai-lecture-agent-workspace"
version = "0.1.0"
description = "Shared agent-control workspace for the AI Lecture System"
requires-python = ">=3.12"
dependencies = [
    "Django~=6.0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
